paths:
  report_dir: research_report
  parquet_path: data/stock_daily.parquet
  output_dir: output
  cache_dir: .cache/stock_picker

universe:
  markets: [SH, SZ, BJ]
  min_market_cap_yi: 100
  industry_leader_rank_max: 3
  broad_industry_rank_mode: reference
  verified_subindustry_ranks: {}

data:
  max_quote_age_days: 3
  local_history_days: 160

technical:
  min_volume_ratio_5d_20d: 1.05
  max_volume_ratio_5d_20d: 2.5
  min_turnover_rate_pct: 0.5
  max_turnover_rate_pct: 12
  min_avg_amount_20d_yi: 0.3
  min_amount_ratio_5d_20d: 1.0
  high_volume_stall_ratio: 2.5
  high_volume_stall_return_abs_pct: 2
  no_volume_rise_ratio: 0.75
  no_volume_rise_return_pct: 5

valuation:
  discount_rate: 0.12
  pe_floor: 8
  pe_cap: 60
  max_peg_for_core: 2.5
  min_growth_span_years: 2
  max_growth_span_years: 3
  scenarios:
    bear:
      peg_range: [0.5, 0.8]
      eps_factor_range: [0.65, 0.85]
    base:
      peg_range: [0.9, 1.1]
      eps_factor_range: [0.9, 1.1]
    bull:
      peg_range: [1.2, 1.5]
      eps_factor_range: [1.1, 1.3]

validation:
  horizons: [5, 20, 60]
  benchmark_codes: [000300.SH, 000852.SH]
